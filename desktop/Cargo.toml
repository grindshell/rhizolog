[package]
name = "rhizolog-desktop"
version.workspace = true
edition = "2024"
license.workspace = true
# Released as a binary, never to crates.io; see the same line in
# backend/Cargo.toml.
publish = false

# NOT `Rhizolog`, however much nicer that would look on a portable download.
# Windows filenames are case-insensitive, so `Rhizolog.exe` and the server's
# `rhizolog.exe` are one file in `target\debug\`: building both leaves whichever
# went last, silently, and `cargo run -p rhizolog` then starts the app. The
# product is still called Rhizolog — that is `productName` in `tauri.conf.json`,
# and it is what the installer and the window use.
[[bin]]
name = "rhizolog-desktop"
path = "src/main.rs"

[dependencies]
# `embed-assets` is why this crate exists in the shape it does: the dashboard
# has to be inside the executable for the executable to travel alone.
rhizolog = { path = "../backend", features = ["embed-assets"] }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-plugin-dialog = "2"
# Only for handing a link to the real browser. Its JavaScript half is switched
# off in `main.rs`: it works by injecting Tauri IPC into the page, which is the
# one thing the dashboard may not have.
tauri-plugin-opener = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
tempfile = "3"
