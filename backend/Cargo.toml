[package]
name = "rhizolog"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = []
# Compile the built dashboard into the binary, for a build that has to travel
# on its own. Requires `frontend/dist` to exist at compile time — the derive
# reads it — so `pnpm build` has to have run. Off by default for that reason:
# the headless server serves the directory and should not need one.
embed-assets = ["dep:rust-embed"]

[dependencies]
anyhow = "1"
# Password hashing. Argon2id is the default and what `PasswordHasher` produces
# here; the PHC string it returns carries its own parameters, so a stored hash
# stays verifiable after the cost settings are raised.
argon2 = "0.5"
axum = "0.8"
# Cookies, for the browser half of a session. The other half is a bearer token,
# and both name the same session — see `knowledge-base/accounts.md`.
axum-extra = { version = "0.10", features = ["cookie"] }
chrono = { version = "0.4", features = ["serde"] }
comrak = { version = "0.54", default-features = false }
notify = "8"
notify-debouncer-full = "0.7.0"
# The OS random source, for session tokens and password salts. Declared rather
# than reached through `argon2::password_hash::rand_core`, because `OsRng` only
# exists there when the `getrandom` feature is on — and a dependency whose
# feature flags decide whether the crate can generate a salt is one worth naming
# out loud. Same version `password-hash` uses, so the two unify.
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# `debug-embed` deliberately: without it a debug build reads the files from the
# absolute path baked in at compile time, which is exactly the trap
# `utoipa-swagger-ui` has already sprung on this project once. An embedded
# build should be embedded in both profiles or the difference will be found
# somewhere unpleasant.
rust-embed = { version = "8", features = ["mime-guess", "debug-embed"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
# Session tokens are stored as their SHA-256, never verbatim: the index is a
# file on disk, and a row that could be replayed as a credential is a row worth
# not writing. Argon2 would be the wrong tool — a 256-bit random token has no
# guessable preimage to slow an attacker down over.
sha2 = "0.10"
thiserror = "2"
# Not a new dependency — `axum-extra`'s cookie support is the `cookie` crate,
# whose durations and timestamps are `time`'s. Named here so a `Max-Age` can be
# spelled at all; without it the session cookie would last only as long as the
# browser window.
time = "0.3"
tokio = { version = "1", features = ["full"] }
# `.rhizolog/prose.toml`, and nothing else. TOML rather than the YAML the
# frontmatter already speaks, because a rules file is largely a list of things
# somebody is trying not to write, and TOML's `\uXXXX` escape is how you name a
# character your repository may not contain. Parsing only: nothing here ever
# writes the file, which is why `display` is off.
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
# No `cors`: everything is same-origin, including the desktop app's webview.
# Turning it on is a decision about who may reach a remote instance from a
# browser context, and it should be made then rather than already switched on.
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
