# cargo-about, which writes the Rust half of THIRD-PARTY-NOTICES.txt for
# packaging/notices.ps1.
#
# `accepted` is the review in knowledge-base/dependency-licences.md, the same
# list deny.toml holds, in order of preference: where a crate offers a choice,
# its notice uses the first of these it offers. A crate under anything else
# fails the release rather than shipping without anybody having read its
# licence, and adding to the list is a decision to write down on that page.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "0BSD",
    "MIT-0",
]

# What a release is built for. notices.ps1 narrows it to the one platform it is
# packaging with --target.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

# Only what is compiled into the program: build scripts, proc-macro helpers
# run at build time and test dependencies are not in it.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Nothing here turns off lookups on clearlydefined.io, because cargo-about 0.9
# makes none: the licence files inside each crate are the whole answer, which
# is what a release build should depend on.

# Rhizolog's own crates say `publish = false`, and are the project rather than
# a third party.
private = { ignore = true }
