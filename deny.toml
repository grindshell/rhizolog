# cargo-deny, which CI runs as `cargo deny check licenses` on every push. The
# build fails when a dependency arrives under a licence nobody has read.
#
# The list is the review in knowledge-base/dependency-licences.md, the same one
# packaging/about.toml holds for the notices. Adding to either is a decision,
# and that page is where it gets written down.

[graph]
# What a release is built for, and every feature, since the server ships with
# `embed-assets` on.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "0BSD",
    "MIT-0",
]
confidence-threshold = 0.9

# Rhizolog's own crates say `publish = false`. They are the project, under the
# AGPL, and not a dependency of anything.
[licenses.private]
ignore = true
